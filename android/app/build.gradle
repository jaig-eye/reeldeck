apply plugin: 'com.android.application'

android {
    namespace "com.reeldeck.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.reeldeck.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 18
        versionName "1.0.20"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    /*
     * Android refuses to install an APK over an app signed with a DIFFERENT
     * certificate -- it fails with "App not installed", which looks like a download
     * or Play Protect problem and is neither.
     *
     * Left alone, `assembleDebug` signs with ~/.android/debug.keystore, and a fresh
     * CI runner has no such file, so Gradle GENERATES A NEW RANDOM ONE every run.
     * Every release was therefore signed by a different key and could never update
     * the one before it. (Verified: v1.0.10 and v1.0.11 have different SHA-256
     * certificate fingerprints, issued an hour apart -- one per CI run.)
     *
     * So: use an explicit keystore when one is supplied, for BOTH build types, and
     * fall back to the old behaviour for local throwaway builds. CI supplies it from
     * a repository secret; see .github/workflows/build.yml.
     */
    signingConfigs {
        shared {
            def ksPath = System.getenv("RELEASE_KEYSTORE") ?: project.findProperty("releaseKeystore")
            if (ksPath && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD") ?: project.findProperty("releaseKeystorePassword")
                keyAlias System.getenv("RELEASE_KEY_ALIAS") ?: project.findProperty("releaseKeyAlias")
                // keytool offers to reuse the store password for the key, and pressing
                // Enter accepts -- which is the common case, and then there is no
                // separate key password to supply. Fall back to the store password so a
                // fourth secret is optional rather than required.
                keyPassword System.getenv("RELEASE_KEY_PASSWORD") ?: project.findProperty("releaseKeyPassword") ?:
                            System.getenv("RELEASE_KEYSTORE_PASSWORD") ?: project.findProperty("releaseKeystorePassword")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (signingConfigs.shared.storeFile != null) signingConfig signingConfigs.shared
        }
        debug {
            // The shipped APK is a debug build (see the CI workflow), so the stable
            // key has to apply here too or the whole exercise is pointless.
            if (signingConfigs.shared.storeFile != null) signingConfig signingConfigs.shared
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // WebViewCompat.addWebMessageListener — the origin-scoped bridge MainActivity uses
    // for the TV pointer, instead of addJavascriptInterface (which every embedded frame
    // would be able to call).
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
