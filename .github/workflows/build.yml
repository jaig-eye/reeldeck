name: Build Electron App

# Builds Windows (.exe: nsis + portable) and macOS (.dmg + .zip) installers.
# The macOS half MUST run on a macOS runner: a .dmg cannot be cross-built on
# Windows/Linux (it needs hdiutil, plus Apple codesign/notarytool for signing).
# electron-builder output dir for this project is "release/", so artifacts are
# uploaded from release/ (not dist/).

on:
  push:
    tags:
      - 'v*'            # push a tag like v1.0.0 to trigger a release build
  workflow_dispatch: {} # allow manual runs from the Actions tab

# Needed so the built-in GITHUB_TOKEN can create the Release and upload assets
# (the web-installer payload the stub downloads).
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false          # a Windows failure must not cancel the macOS job
      matrix:
        include:
          - os: windows-latest
            # nsis-web = the tiny web-installer stub + its payload; portable = full single exe.
            # --publish always uploads them (incl. the .nsis.7z the stub fetches) to the GitHub Release.
            build_cmd: npx electron-builder --win nsis-web portable --publish always
          - os: macos-latest     # Apple Silicon (arm64); billed at 10x on private repos
            build_cmd: npx electron-builder --mac --publish always

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7        # current major (v7.0.1, verified Aug 2026)

      - name: Set up Node.js
        uses: actions/setup-node@v7      # current major (v7.0.0, verified Aug 2026)
        with:
          node-version: 22               # active LTS; 20 is also fine
          cache: npm                     # cache ~/.npm, keyed on package-lock.json

      - name: Install dependencies
        run: npm ci                      # clean, lockfile-exact install

      - name: Build installer (OS-specific)
        run: ${{ matrix.build_cmd }}
        env:
          # Only consumed if you later switch to --publish; harmless otherwise.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers
        uses: actions/upload-artifact@v7   # current major (v7.0.1, verified Aug 2026)
        with:
          # UNIQUE per matrix job: v4+ artifacts are immutable, so a shared name
          # would make the second job's upload fail.
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml

  # Android APK — the SAME universal apk installs on phones and Android/Google TV.
  # Runs independently (a flaky mac build never blocks the apk) and, on a tag,
  # attaches Reeldeck.apk to the release so Downloader can fetch it from
  # github.com/<owner>/<repo>/releases/latest/download/Reeldeck.apk
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets + sync Capacitor
        run: |
          node scripts/build-web.js
          npx cap sync android

      # Without a stable key each runner generates its own debug keystore, so every
      # release is signed differently and Android refuses to install one over the
      # last ("App not installed"). Decoded from a secret so the key never lives in
      # the repository. If the secret is absent the build still succeeds -- it just
      # produces an APK that cannot update an existing install, which is the old
      # behaviour and is flagged in the log rather than failing the release.
      - name: Restore signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/reeldeck.jks"
            echo "keystore=$RUNNER_TEMP/reeldeck.jks" >> "$GITHUB_OUTPUT"
            echo "Signing with the shared release key."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set - this APK will NOT be able to update an existing install."
          fi

      - name: Build debug APK
        env:
          RELEASE_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Reeldeck.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          if-no-files-found: error
          retention-days: 7
          path: Reeldeck.apk

      - name: Attach APK to the release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Reeldeck.apk
