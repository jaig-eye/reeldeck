<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Reeldeck</title>
  <meta name="description" content="A clean, ad-free movie & TV browser powered by the TMDB API." />

  <!-- PWA / installable app -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Reeldeck" />
  <link rel="icon" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icon-180.png" />

  <link rel="preconnect" href="https://api.themoviedb.org" />
  <link rel="preconnect" href="https://image.tmdb.org" />
  <!-- Archivo (headings, set narrow on its width axis) and Manrope (interface) are
       self-hosted variable files in assets/fonts, declared in styles.css: the TV, the APK
       and an offline PWA get the real faces, and nothing here talks to Google. The two
       Latin files are preloaded because they are used above the fold on every screen. -->
  <link rel="preload" href="assets/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles.css?v=64" />
  <!-- The new design system (Reeldeck Stage). Loads after styles.css, which it replaces
       screen by screen; see the header of stage.css. -->
  <link rel="stylesheet" href="stage.css?v=64" />
  <!-- Fallbacks for older engines (LG webOS 6 is Chromium 79), generated by scripts/compat-css.js;
       a current browser applies none of it. Last, so its rules follow the ones they stand in for. -->
  <link rel="stylesheet" href="compat.css?v=64" />
  <!-- Apply the saved theme before first paint to avoid a flash (key must match app.js CONFIG_KEY) -->
  <script>try{var c=JSON.parse(localStorage.getItem('reeldeck.config.v5')||'{}');if(c&&c.theme){document.documentElement.setAttribute('data-theme',c.theme);}}catch(e){}</script>
</head>
<body>
  <header class="top"></header>
  <main><div id="view"></div></main>
  <footer class="site">
    <div>Built as a clean, ad-free front-end. Metadata &amp; images from <a href="https://www.themoviedb.org" target="_blank" rel="noopener">TMDB</a>.
      This product uses the TMDB API but is not endorsed or certified by TMDB.</div>
    <div>Not affiliated with any streaming provider.</div>
  </footer>
  <script src="assets/vendor/qrcode.js"></script>
  <script src="app.js?v=64"></script>
</body>
</html>
