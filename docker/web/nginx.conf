server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
  gzip_min_length 1024;

  # The shell must always be revalidated: index.html is what names the versioned
  # app.js?v=NN, and sw.js is what decides which of those is cached. A stale copy of
  # either pins an installed app to an old release for ever.
  location = /index.html            { add_header Cache-Control "no-cache"; }
  location = /sw.js                 { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest  { add_header Cache-Control "no-cache"; types { application/manifest+json webmanifest; } }

  # Versioned by query string (?v=NN), so the bytes behind a URL never change.
  location ~* \.(?:js|css)$         { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location /assets/                 { add_header Cache-Control "public, max-age=2592000"; }

  # Hash routing: every real path is a file, so there is nothing to rewrite.
  location / { try_files $uri $uri/ =404; }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
